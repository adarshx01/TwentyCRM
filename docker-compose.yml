# Local development stack. Twenty runs under the `twenty` profile and MUST be pinned (never `latest`):
#   TWENTY_VERSION=<tested release> docker compose --profile twenty up
name: crm-bee
x-app: &app
  build: .
  image: crm-bee:dev
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql://crmbee_app:crmbee_app@postgres:5432/crmbee
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    S3_BUCKET: crmbee-media
    NODE_ENV: development
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16.4-alpine
    environment: { POSTGRES_PASSWORD: postgres }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin &&
                  mc mb -p local/crmbee-media && mc anonymous set none local/crmbee-media"

  migrate:
    build: .
    image: crm-bee:dev
    command: ["node", "dist/database/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://crmbee_owner:crmbee_owner@postgres:5432/crmbee
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    environment: { <<: *app-env, APP_ROLE: api }
    ports: ["3000:3000"]
  worker:
    <<: *app
    environment: { <<: *app-env, APP_ROLE: worker, APP_PORT: "3001" }
  scheduler:
    <<: *app
    environment: { <<: *app-env, APP_ROLE: scheduler, APP_PORT: "3002" }

  clamav:
    profiles: [scan]
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

  # --- Twenty (profile: twenty). Pin TWENTY_VERSION to the release validated in the feasibility gates.
  twenty-db:
    profiles: [twenty]
    image: postgres:16.4-alpine
    environment: { POSTGRES_USER: twenty, POSTGRES_PASSWORD: twenty, POSTGRES_DB: default }
    volumes: [twentydb:/var/lib/postgresql/data]
  twenty-redis:
    profiles: [twenty]
    image: redis:7.4-alpine
  twenty-server:
    profiles: [twenty]
    image: twentycrm/twenty:${TWENTY_VERSION:?pin a tested Twenty release}
    depends_on: [twenty-db, twenty-redis]
    environment:
      PG_DATABASE_URL: postgres://twenty:twenty@twenty-db:5432/default
      REDIS_URL: redis://twenty-redis:6379
      SERVER_URL: http://localhost:3100
      APP_SECRET: ${TWENTY_APP_SECRET:?set a random secret}
      IS_MULTIWORKSPACE_ENABLED: "true"
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_NAME: twenty-files
      STORAGE_S3_REGION: us-east-1
    ports: ["3100:3000"]

volumes: { pgdata: {}, minio: {}, twentydb: {} }
