; PgBouncer for the API tier (transaction pooling). Workers and the pg-boss queue connect DIRECTLY to Postgres
; (QUEUE_DATABASE_URL) because they rely on session behaviour. The application uses unprepared statements and
; transaction-local settings (set_config(..., true)), which are safe under transaction pooling.
[databases]
crmbee = host=CLOUD_SQL_PRIVATE_IP port=5432 dbname=crmbee

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 400
default_pool_size = 20
reserve_pool_size = 5
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
server_tls_sslmode = require
