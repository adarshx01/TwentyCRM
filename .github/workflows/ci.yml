name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: PostgreSQL 16 server binaries (tests start an ephemeral cluster)
        run: sudo apt-get update && sudo apt-get install -y postgresql-16 && echo "PG_BIN=/usr/lib/postgresql/16/bin" >> $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crm-bee:ci .
