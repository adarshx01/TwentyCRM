[project]
name = "conversation"
version = "0.1.0"
description = "Conversational CRM service. Twenty stays the system of record."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "PyJWT>=2.9",
  "cryptography>=43",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
